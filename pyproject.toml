[project]
name = "marimo-rdkit-molab-demo"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "marimo>=0.23.6",
  "rdkit>=2024.9.6"
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
edit = "marimo edit notebooks/rdkit_demo.py"
run = "marimo run notebooks/rdkit_demo.py --host 0.0.0.0 --port 8080"
