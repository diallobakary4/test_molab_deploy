[project]
name = "marimo-rdkit-molab-demo"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "marimo>=0.23.6",
  "rdkit>=2024.9.6"
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
edit = "marimo edit notebooks/rdkit_demo.py"
run = "marimo run notebooks/rdkit_demo.py --host 0.0.0.0 --port 7860"

[tool.pixi.dependencies]
python = ">=3.12.*"
jupyterlab = ">=4.5.8,<5"
notebook = ">=7.5.7,<8"
jupyterhub = ">=5.4.6,<6"
ipykernel = ">=7.2.0,<8"
marimo = ">=0.23.9,<0.24"
jupyter-server-proxy = ">=4.5.0,<5"
jupyter = ">=1.1.1,<2"
pip = ">=26.1.2,<27"
